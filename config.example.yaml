mysql:
  db: neoai
  host: localhost
  password: neoai123456
  port: 3306
  user: root
  tls: false                # enable TLS for MySQL connection
  tls_skip_verify: false    # skip cert verification (self-signed certs)
  tls_ca: ""                # path to CA cert PEM file (for private CA)
  tls_server_name: ""       # override SNI / ServerName (defaults to mysql.host)
  # params: "charset=utf8mb4&parseTime=true&loc=Local"  # extra DSN params

# Cache / KV store.
# NeoAI supports three wire-protocol compatible backends. Pick any one of:
#   - redis       (default, https://redis.io)
#   - valkey      (https://valkey.io — Redis fork, drop-in replacement)
#   - dragonfly   (https://dragonflydb.io — multi-threaded Redis-compatible)
#
# All three speak RESP, so the same client works against any of them.
# The `type` field only affects logging/health reporting — no code path
# is wired to a specific vendor.
#
# Two config blocks are accepted:
#   1. `cache:` (preferred — explicit, supports all three backends)
#   2. `redis:` (legacy — kept for backwards compatibility with coai configs)
# If both are present, `cache:` wins.
cache:
  type: valkey           # redis | valkey | dragonfly
  host: localhost
  port: 6379
  db: 0
  password: ""
  tls: false             # enable TLS (for Redis/Valkey/Dragonfly over TLS)
  tls_skip_verify: false # skip cert verification (self-signed certs)
  tls_ca: ""             # path to CA cert PEM file (for private CA)

# Legacy block — still parsed when `cache:` is absent.
# Commented out by default to encourage migration to the `cache:` block.
# redis:
#   host: localhost
#   port: 6379
#   db: 0
#   password: ""

secret: secret
serve_static: true

server:
  port: 8094
system:
  general:
    backend: ""
  mail:
    host: ""
    port: 465
    username: ""
    password: ""
    from: ""
  search:
    endpoint: https://duckduckgo-api.vercel.app
    query: 5

  # NeoAI: gated registration. When enabled, new users must supply a
  # valid registration code during signup. Toggle at runtime via the
  # admin "Registration Codes" page.
  registration:
    require_code: false

  # NeoAI: OAuth provider config. Leave client_id empty to disable.
  # Configure from the admin "OAuth Login" page; values below are
  # written there.
  oauth:
    linuxdo:
      client_id: ""
      client_secret: ""
    github:
      client_id: ""
      client_secret: ""
    # Where to redirect the user after OAuth callback completes.
    # e.g. https://app.example.com
    frontend_url: ""

