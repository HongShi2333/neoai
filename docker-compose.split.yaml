version: '3'

# docker-compose.split.yaml — NeoAI with frontend and backend deployed
# as separate services, suitable for production split deployments.
#
# Usage:
#   1.  Copy this file to docker-compose.override.yaml or use directly.
#   2.  Edit VITE_BACKEND_ENDPOINT below to your backend's public URL
#       (e.g. https://api.example.com).
#   3.  docker compose -f docker-compose.split.yaml up -d
#
# The frontend container builds the SPA with the backend URL baked in,
# then serves it via nginx. The backend container exposes the API on
# port 8094 — front it with your own TLS-terminating proxy / CDN.

services:
  mysql:
    image: mysql:latest
    container_name: db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: neoai
      MYSQL_USER: neoai
      MYSQL_PASSWORD: neoai123456!
      TZ: Asia/Shanghai
    expose:
      - "3306"
    volumes:
      - ./db:/var/lib/mysql
    networks:
      - neoai-network

  cache:
    image: valkey/valkey:latest
    container_name: cache
    restart: always
    expose:
      - "6379"
    volumes:
      - ./cache:/data
    networks:
      - neoai-network

  backend:
    image: neoai/neoai-backend
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: neoai-backend
    restart: always
    ports:
      - "8094:8094"
    depends_on:
      - mysql
      - cache
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: neoai
      MYSQL_PASSWORD: neoai123456!
      MYSQL_DB: neoai
      CACHE_TYPE: valkey
      CACHE_HOST: cache
      CACHE_PORT: 6379
      CACHE_PASSWORD: ""
      CACHE_DB: 0
      SERVE_STATIC: "false"
      # Comma-separated list of allowed CORS origins (the frontend URL).
      ALLOW_ORIGINS: "https://app.example.com"
    volumes:
      - ./config:/config
      - ./logs:/logs
      - ./storage:/storage
    networks:
      - neoai-network

  frontend:
    image: neoai/neoai-frontend
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        # REQUIRED: the public URL of the backend API.
        VITE_BACKEND_ENDPOINT: "https://api.example.com"
        VITE_APP_NAME: "NeoAI"
    container_name: neoai-frontend
    restart: always
    ports:
      - "8080:80"
    networks:
      - neoai-network

networks:
  neoai-network:
    driver: bridge
