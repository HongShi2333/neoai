# nginx.conf — sample reverse proxy config for NeoAI.
#
# Two deployment modes are supported:
#
# 1) BUNDLED (default): frontend + backend served from the same origin.
#    Use `proxy_pass http://127.0.0.1:8000` (the bundled docker image).
#
# 2) SPLIT (recommended for production): serve the frontend from a
#    CDN or static host, run only the backend behind nginx, and use
#    the config below to expose only the API on the backend host.
#
#    For cross-origin split deployment (frontend on app.example.com,
#    backend on api.example.com) you also need to set
#    `allow_origins: ["https://app.example.com"]` in config.yaml
#    so the backend emits the right CORS headers.

server
{
    listen 80;
    server_name _;

    # Block sensitive files from being served.
    location ~ ^/(\.user.ini|\.htaccess|\.git|\.svn|\.project|LICENSE|README.md|package.json|package-lock.json|\.env) {
        return 404;
    }

    if ( $uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$" ) {
        return 403;
    }

    location ~ /purge(/.*) {
        proxy_cache_purge cache_one 127.0.0.1$request_uri$is_args$args;
    }

    # ---- API routes -------------------------------------------------
    # For BUNDLED mode: backend also serves the SPA via /app/dist.
    # For SPLIT mode: backend only answers /api, /v1, /mj, /attachments,
    # /community — set `serve_static: false` in config.yaml.

    location / {
        # bundled mode: 8094 (binary), 8000 (docker port)
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header REMOTE-HOST $remote_addr;
        proxy_set_header X-Host $host:$server_port;
        proxy_set_header X-Scheme $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 86400s;   # long enough for streaming chat
        proxy_send_timeout 30s;
        proxy_http_version 1.1;
        # WebSocket upgrade (used by /api/community/ws and chat relay)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    access_log  /www/wwwlogs/neoai.log;
    error_log  /www/wwwlogs/neoai.error.log;
}

# ---------------------------------------------------------------------------
# SPLIT MODE — uncomment & adapt when serving frontend on a different host.
